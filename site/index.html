<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>जागेश्वर · Pahari Scroll</title>
  <meta name="description" content="An infinite procedurally generated Kumaoni landscape: the Jageshwar temple valley in the Kangra miniature idiom. No images, no textures, one seed." />
  <meta name="theme-color" content="#A8432E" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="favicon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg id="scene" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMinYMin slice" aria-label="Infinite Pahari landscape scroll"></svg>
  <svg id="sky-fx" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
  <div id="frame" aria-hidden="true"></div>
  <audio id="bgm" src="audio/last-light-over-peaks.mp3" loop preload="auto"></audio>

  <header class="title">
    <h1>जागेश्वर</h1>
    <p>Pahari Scroll · a procedural Kumaoni valley</p>
    <p id="wx" class="wx" aria-live="polite"></p>
  </header>

  <nav class="ui" aria-label="Controls">
    <button id="seed" title="Change seed">seed <b>–</b></button>
    <button id="new" title="Random seed">new</button>
    <button id="auto" title="Auto-scroll (space)">drift</button>
    <button id="home" title="Back to the start">home</button>
    <button id="save" title="Download the current view as SVG">save svg</button>
    <button id="sound" class="icon" title="Music on / off" aria-pressed="true" aria-label="Toggle music"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path class="wave" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
    <span class="pos" title="Position in chunks"><span id="pos">0.00</span></span>
  </nav>

  <p class="hint">scroll · drag · ← → <a class="gh" href="https://github.com/bhattji007/pahari-scroll" target="_blank" rel="noopener" title="Source on GitHub"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg> github</a></p>

  <script type="module" src="src/main.js"></script>
</body>
</html>
